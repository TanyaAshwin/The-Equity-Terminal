<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Equity Terminal — Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #0d0f12;
    --panel: #15181d;
    --border: #2a2e35;
    --text: #e8e9eb;
    --muted: #8a8f98;
    --accent: #4f8cff;
    --accent-hover: #3d78ea;
    --error: #ff5c5c;
    --success: #3ecf8e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 40px;
    width: 100%;
    max-width: 420px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .subtitle {
    color: var(--muted);
    font-size: 13px;
    margin: 0 0 28px;
  }
  label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  input[type="email"], input[type="password"] {
    width: 100%;
    padding: 11px 12px;
    background: #0d0f12;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
    margin-bottom: 16px;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    width: 100%;
    padding: 12px;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    color: white;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .msg {
    font-size: 13px;
    margin-top: 14px;
    text-align: center;
  }
  .msg.error { color: var(--error); }
  .msg.success { color: var(--success); }

  /* Upload panel */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }
  .top-bar span { font-size: 13px; color: var(--muted); }
  .top-bar button.logout {
    width: auto;
    padding: 8px 14px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    font-weight: 400;
  }
  .top-bar button.logout:hover { background: #1c2027; color: var(--text); }

  .dropzone {
    border: 2px dashed var(--border);
    border-radius: 10px;
    padding: 32px 16px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 20px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .dropzone.dragover { border-color: var(--accent); background: rgba(79,140,255,0.06); }
  .dropzone input { display: none; }

  ul.file-list {
    list-style: none;
    padding: 0;
    margin: 0 0 20px;
    max-height: 260px;
    overflow-y: auto;
  }
  ul.file-list li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 8px;
    font-size: 13px;
  }
  ul.file-list li a { color: var(--accent); text-decoration: none; word-break: break-all; }
  ul.file-list li a:hover { text-decoration: underline; }
  ul.file-list li button.del {
    width: auto;
    padding: 4px 8px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--error);
    font-size: 12px;
    margin-left: 10px;
    flex-shrink: 0;
  }
  ul.file-list li button.del:hover { background: rgba(255,92,92,0.1); }
  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 20px 0; }
</style>
</head>
<body>

<div class="card" id="app">
  <!-- content injected by JS -->
</div>

<script>
  const SUPABASE_URL = "https://imfvmjdbyqrepadgqjyp.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_H20XOlSPQA1qMjI3uH7rog_JARKxkZ9";
  const BUCKET = "reports";

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const app = document.getElementById("app");

  async function init() {
    const { data: { session } } = await sb.auth.getSession();
    if (session) {
      renderUpload(session);
    } else {
      renderLogin();
    }
  }

  function renderLogin() {
    app.innerHTML = `
      <h1>The Equity Terminal</h1>
      <p class="subtitle">Sign in to manage files</p>
      <form id="login-form">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="username">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password">
        <button type="submit" id="login-btn">Log in</button>
      </form>
      <div id="login-msg" class="msg"></div>
    `;

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("login-btn");
      const msg = document.getElementById("login-msg");
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      btn.disabled = true;
      btn.textContent = "Logging in...";
      msg.textContent = "";
      msg.className = "msg";

      const { data, error } = await sb.auth.signInWithPassword({ email, password });

      if (error) {
        msg.textContent = error.message;
        msg.className = "msg error";
        btn.disabled = false;
        btn.textContent = "Log in";
      } else {
        renderUpload(data.session);
      }
    });
  }

  async function renderUpload(session) {
    app.innerHTML = `
      <div class="top-bar">
        <span>${session.user.email}</span>
        <button class="logout" id="logout-btn">Log out</button>
      </div>
      <div class="dropzone" id="dropzone">
        Drag & drop files here, or click to choose
        <input type="file" id="file-input" multiple>
      </div>
      <div id="upload-msg" class="msg"></div>
      <ul class="file-list" id="file-list"></ul>
    `;

    document.getElementById("logout-btn").addEventListener("click", async () => {
      await sb.auth.signOut();
      renderLogin();
    });

    const dropzone = document.getElementById("dropzone");
    const fileInput = document.getElementById("file-input");

    dropzone.addEventListener("click", () => fileInput.click());
    dropzone.addEventListener("dragover", (e) => { e.preventDefault(); dropzone.classList.add("dragover"); });
    dropzone.addEventListener("dragleave", () => dropzone.classList.remove("dragover"));
    dropzone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropzone.classList.remove("dragover");
      handleFiles(e.dataTransfer.files);
    });
    fileInput.addEventListener("change", (e) => handleFiles(e.target.files));

    async function handleFiles(fileListObj) {
      const files = Array.from(fileListObj);
      const msg = document.getElementById("upload-msg");
      for (const file of files) {
        msg.textContent = `Uploading ${file.name}...`;
        msg.className = "msg";
        const path = `${Date.now()}_${file.name}`;
        const { error } = await sb.storage.from(BUCKET).upload(path, file, { upsert: false });
        if (error) {
          msg.textContent = `Failed: ${file.name} — ${error.message}`;
          msg.className = "msg error";
          return;
        }
      }
      msg.textContent = "Upload complete.";
      msg.className = "msg success";
      fileInput.value = "";
      loadFiles();
    }

    async function loadFiles() {
      const listEl = document.getElementById("file-list");
      const { data, error } = await sb.storage.from(BUCKET).list("", {
        sortBy: { column: "created_at", order: "desc" },
      });

      if (error) {
        listEl.innerHTML = `<div class="empty">Couldn't load files: ${error.message}</div>`;
        return;
      }
      if (!data || data.length === 0) {
        listEl.innerHTML = `<div class="empty">No files uploaded yet.</div>`;
        return;
      }

      listEl.innerHTML = "";
      for (const f of data) {
        const { data: urlData } = sb.storage.from(BUCKET).getPublicUrl(f.name);
        const li = document.createElement("li");
        li.innerHTML = `
          <a href="${urlData.publicUrl}" target="_blank" rel="noopener">${f.name}</a>
          <button class="del" data-name="${f.name}">Delete</button>
        `;
        listEl.appendChild(li);
      }

      listEl.querySelectorAll(".del").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const name = btn.getAttribute("data-name");
          if (!confirm(`Delete ${name}?`)) return;
          await sb.storage.from(BUCKET).remove([name]);
          loadFiles();
        });
      });
    }

    loadFiles();
  }

  init();
</script>

</body>
</html>
